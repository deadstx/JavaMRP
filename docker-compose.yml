
services:
  postgres:
    image: postgres:16
    container_name: mrp-postgres
    restart: always
    environment:
      POSTGRES_DB: mrp
      POSTGRES_USER: mrp_user
      POSTGRES_PASSWORD: test123
    ports:
      - "5431:5432"
    volumes:
      - mrp_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mrp_data:
